<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#94d2bd;#ee9b00;#ca6702;#00e5ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#94d2bd">
        <animate attributeName="stop-color" values="#94d2bd;#ee9b00;#ca6702;#00e5ff;#94d2bd" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ee9b00">
        <animate attributeName="stop-color" values="#ee9b00;#ca6702;#00e5ff;#94d2bd;#ee9b00" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#ca6702">
        <animate attributeName="stop-color" values="#ca6702;#00e5ff;#94d2bd;#ee9b00;#ca6702" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#94d2bd;#ee9b00;#ca6702;#00e5ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="900" height="240" fill="#010508"/>
  <g stroke="#0c2a30" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/><line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="120" y1="0" x2="120" y2="240"/><line x1="780" y1="0" x2="780" y2="240"/>
  </g>
  <rect x="28" y="28" width="844" height="184" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.65"/>
  <rect x="34" y="34" width="832" height="172" fill="none" stroke="#ee9b00" stroke-width="1" opacity="0.35"/>

  <text x="450" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" letter-spacing="8" fill="#7da9b3">CREATIVE DEVELOPER · DESIGNER · OSLO</text>
  <text x="450" y="152" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="bold" font-size="64" letter-spacing="4" fill="url(#rainbow)">MARLOWE_OS</text>

  <text x="450" y="192" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#00e5ff">v3.2.1 — every pixel generated
    <tspan fill="#ee9b00">
      ▮<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </tspan>
  </text>

  <rect width="900" height="240" fill="url(#scan)"/>
  <g fill="#ee9b00">
    <circle cx="56" cy="56" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="844" cy="56" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="56" cy="184" r="3"><animate attributeName="opacity" values=".6;1;.6" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="844" cy="184" r="3"><animate attributeName="opacity" values="1;.4;1" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
</svg>
