<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28">
  <defs>
    <linearGradient id="rainbow-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#ee9b00;#94d2bd;#ca6702;#00e5ff" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#ee9b00"><animate attributeName="stop-color" values="#ee9b00;#94d2bd;#ca6702;#00e5ff;#ee9b00" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#ca6702;#94d2bd;#ee9b00;#00e5ff" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <rect width="900" height="28" fill="#00000000"/>
  <line x1="0" y1="14" x2="900" y2="14" stroke="url(#rainbow-line)" stroke-width="2" stroke-dasharray="14 10" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.6s" repeatCount="indefinite"/>
  </line>
  <circle cx="450" cy="14" r="5" fill="#ee9b00">
    <animate attributeName="r" values="5;8;5" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.45;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="520" y="19" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="4" fill="#7da9b3">· SECTION BREAK ·</text>
</svg>
