<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <rect width="900" height="120" fill="#010508"/>
  <g font-family="ui-monospace,Menlo,monospace" font-size="12" text-anchor="middle">
    <g>
      <rect x="40" y="24" width="200" height="56" fill="#00e5ff"><animate attributeName="opacity" values="1;.78;1" dur="3s" begin="0s" repeatCount="indefinite"/></rect>
      <text x="140" y="100" fill="#00e5ff">--cyan #00E5FF</text>
    </g>
    <g>
      <rect x="260" y="24" width="200" height="56" fill="#ee9b00"><animate attributeName="opacity" values="1;.78;1" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
      <text x="360" y="100" fill="#ee9b00">--amber #EE9B00</text>
    </g>
    <g>
      <rect x="480" y="24" width="200" height="56" fill="#94d2bd"><animate attributeName="opacity" values="1;.78;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
      <text x="580" y="100" fill="#94d2bd">--sage #94D2BD</text>
    </g>
    <g>
      <rect x="700" y="24" width="200" height="56" fill="#ca6702" transform="translate(-40,0)"><animate attributeName="opacity" values="1;.78;1" dur="3s" begin="1.8s" repeatCount="indefinite"/></rect>
      <text x="800" y="100" fill="#ca6702">--orange #CA6702</text>
    </g>
  </g>
  <text x="40" y="16" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="3" fill="#7da9b3">// css design tokens — deep space black + crt accents</text>
</svg>
